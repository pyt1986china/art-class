<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>美术班出勤</title>

<style>
body{margin:0;font-family:sans-serif;background:#f6f4f0}
.header{padding:10px;background:#fff;display:flex;align-items:center;justify-content:space-between}
.year-bar{display:flex;gap:10px;align-items:center}
button{cursor:pointer}
.card{background:#fff;margin:10px;padding:10px;border-radius:10px}
.day{display:inline-block;width:36px;height:36px;margin:4px;text-align:center;line-height:36px;border-radius:6px;background:#eee;cursor:pointer}
.day.att{background:#8fd19e}
</style>
</head>

<body>

<div class="header">
  <div class="year-bar">
    <button onclick="changeYear(-1)">◀</button>
    <div id="yearLabel"></div>
    <button onclick="changeYear(1)">▶</button>
  </div>
  <button onclick="addStudent()">＋</button>
</div>

<div id="content"></div>

<script>
let currentYear = new Date().getFullYear();
let students = [];
let attendance = {};

// ===== 工具 =====
function getSundays(year){
  const list=[];
  const d=new Date(year,0,1);
  while(d.getDay()!=0){d.setDate(d.getDate()+1)}
  while(d.getFullYear()==year){
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    list.push(`${y}-${m}-${day}`);
    d.setDate(d.getDate()+7);
  }
  return list;
}

function groupByMonth(arr){
  const g={};
  arr.forEach(d=>{
    const m=d.slice(0,7);
    if(!g[m]) g[m]=[];
    g[m].push(d);
  });
  return g;
}

// ===== 渲染 =====
function render(){
  document.getElementById('yearLabel').textContent=currentYear;

  const data=groupByMonth(getSundays(currentYear));
  const content=document.getElementById('content');

  content.innerHTML=students.map(s=>{
    const att=attendance[s.id]||new Set();

    const months=Object.entries(data).map(([m,days])=>{
      const cells=days.map(d=>{
        const cls=att.has(d)?'day att':'day';
        return `<div class="${cls}" onclick="toggle('${s.id}','${d}')">${d.slice(5)}</div>`;
      }).join('');
      return `<div><b>${m}</b><br>${cells}</div>`;
    }).join('');

    return `<div class="card">
      <b>${s.name}</b>
      <div>${months}</div>
    </div>`;
  }).join('');
}

// ===== 操作 =====
function toggle(id,date){
  if(!attendance[id]) attendance[id]=new Set();
  const set=attendance[id];

  if(set.has(date)) set.delete(date);
  else set.add(date);

  render();
}

// ===== 年份 =====
function changeYear(n){
  currentYear+=n;
  render();
}

// ===== 学生 =====
function addStudent(){
  const name=prompt("学生名字");
  if(!name) return;

  const id=crypto.randomUUID();
  students.push({id,name});
  attendance[id]=new Set();

  render();
}

// ===== 初始化 =====
render();
</script>

</body>
</html>
